<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Deletion Request - WalkWise: Smart Step Tracking App</title>
    <link rel="icon" type="image/png" href="https://healthtrackapp.com/images/app_icon.png">
    <link rel="shortcut icon" type="image/x-icon" href="https://healthtrackapp.com/favicon.ico">
    <link rel="apple-touch-icon" href="https://healthtrackapp.com/images/app_icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Outfit', sans-serif;
            line-height: 1.6;
            color: #2D3748;
            background: linear-gradient(135deg, #F7FAFC 0%, #EDF2F7 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background-color: #ffffff;
            padding: 36px 32px;
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
            border: 1px solid #E2E8F0;
            max-width: 520px;
            width: 100%;
            margin: 20px auto;
        }
        h1 {
            color: #E64A19;
            font-size: 26px;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 8px;
            text-align: center;
        }
        .subtitle {
            text-align: center;
            font-size: 14px;
            color: #718096;
            margin-bottom: 24px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 14px;
            color: #4A5568;
        }
        input[type="text"], input[type="email"], textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #CBD5E0;
            border-radius: 10px;
            font-size: 14px;
            font-family: 'Outfit', sans-serif;
            transition: all 0.2s ease;
            background-color: #FAFAFA;
        }
        input[type="text"]:focus, input[type="email"]:focus, textarea:focus {
            outline: none;
            border-color: #E64A19;
            background-color: #FFFFFF;
            box-shadow: 0 0 0 3px rgba(230, 74, 25, 0.15);
        }
        .btn-submit {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            background: linear-gradient(135deg, #E64A19 0%, #D84315 100%);
            color: #ffffff;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 4px 12px rgba(230, 74, 25, 0.25);
            transition: all 0.2s ease;
            margin-top: 10px;
        }
        .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(230, 74, 25, 0.35);
            background: linear-gradient(135deg, #D84315 0%, #BF360C 100%);
        }
        .footer {
            margin-top: 36px;
            text-align: center;
            font-size: 12px;
            color: #A0AEC0;
            border-top: 1px solid #EDF2F7;
            padding-top: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Account Deletion Request</h1>
        <p class="subtitle">Submit a request to permanently delete your WalkWise: Smart Step Tracking account and associated cloud data.</p>
        
        <form action="https://formspree.io/f/mqkvlqoo" method="POST">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required placeholder="Enter your full name">
            </div>
            
            <div class="form-group">
                <label for="email">Account Email Address</label>
                <input type="email" id="email" name="email" required placeholder="your.email@example.com">
            </div>

            <div class="form-group">
                <label for="phone">Registered Phone Number (Optional)</label>
                <input type="text" id="phone" name="phone" placeholder="+1 234 567 8900">
            </div>
            
            <div class="form-group">
                <label for="reason">Reason for Deletion (Optional)</label>
                <textarea id="reason" name="reason" rows="3" placeholder="Tell us why you are deleting your account..."></textarea>
            </div>
            
            <button type="submit" class="btn-submit">Submit Deletion Request</button>
        </form>
        
        <div class="footer">
            <p>&copy; 2026 WalkWise: Smart Step Tracking App. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
